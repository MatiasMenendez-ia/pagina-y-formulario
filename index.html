  /* ── Tags ── */
  function addTagEnter(e) {
    if (e.key !== 'Enter') return;
    const input = document.getElementById('tag-input');
    const val = input.value.trim().toLowerCase();
    if (!val) return;
    const s = studies.find(x => x.id === currentId);
    if (!s) return;
    saveCurrentStudy();
    if (!s.tags.includes(val)) s.tags.push(val);
    input.value = '';
    saveStudies();
    renderSidebar();
    renderEditor(s);
  }
  function removeTag(tag) {
    const s = studies.find(x => x.id === currentId);
    if (!s) return;
    saveCurrentStudy();
    s.tags = s.tags.filter(t => t !== tag);
    saveStudies();
    renderSidebar();
    renderEditor(s);
  }

  /* ── Print / Share ── */
  function printStudy() {
    saveCurrentStudy();
    const s = studies.find(x => x.id === currentId);
    if (!s) return;
    const wasRead = readMode;
    readMode = true;
    renderReadMode(s);
    setTimeout(() => {
      window.print();
      readMode = wasRead;
      if (!wasRead) renderEditor(s);
    }, 300);
  }

  function exportAllPDF() {
    if (studies.length === 0) return showToast('No hay estudios');
    const html = studies.map(s => {
      const verseSafe = (s.verse || '').replace(/<\/?(?!mark|\/mark)[^>]+>/g, '');
      let tplHtml = '';
      if (s.soap && Object.values(s.soap).some(v => v)) {
        const labels = {
          soap: ['Escritura', 'Observación', 'Aplicación', 'Oración'],
          inductivo: ['¿Qué dice?', '¿Qué significa?', '¿Cómo aplico?'],
          devocional: ['Reflexión', 'Aplicación', 'Oración'],
          exegetico: ['Contexto', 'Análisis', 'Significado', 'Aplicación']
        }[s.template];
        if (labels) {
          const keys = s.template === 'inductivo' ? ['s','o','a'] : s.template === 'devocional' ? ['s','a','p'] : ['s','o','a','p'];
          tplHtml = labels.map((lbl, i) => {
            const v = s.soap[keys[i]]; if (!v) return '';
            return `<h3>${lbl}</h3><div>${renderMarkdown(v)}</div>`;
          }).join('');
        }
      }
      return `
        <article style="page-break-after:always;padding:30px 50px;">
          <h1 style="font-family:'Crimson Pro',serif;color:#3C3489;">${esc(s.title)}</h1>
          <p style="font-family:'DM Mono',monospace;color:#7F77DD;margin-bottom:20px;">${esc(s.reference)} · ${s.date}</p>
          ${verseSafe ? `<div style="background:#EEEDFE;border-left:3px solid #7F77DD;padding:15px;margin-bottom:20px;font-style:italic;">${verseSafe}</div>` : ''}
          ${tplHtml}
          ${s.notes ? `<div>${renderMarkdown(s.notes)}</div>` : ''}
          ${(s.tags||[]).length ? `<p style="margin-top:20px;color:#7F77DD;">Temas: ${s.tags.join(', ')}</p>` : ''}
        </article>`;
    }).join('');
    const w = window.open('', '_blank');
    w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Diario Bíblico</title>
      <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=DM+Mono&display=swap" rel="stylesheet">
      <style>body{font-family:'Crimson Pro',serif;line-height:1.6;color:#1A1A2E;}h1{color:#3C3489;}h3{color:#26215C;margin-top:14px;font-size:14px;text-transform:uppercase;letter-spacing:1px;font-family:'DM Mono',monospace;}</style>
      </head><body>${html}</body></html>`);
    w.document.close();
    setTimeout(() => w.print(), 500);
  }

  function shareStudy() {
    saveCurrentStudy();
    const s = studies.find(x => x.id === currentId);
    if (!s) return;
    const shareText = `${s.title}\n${s.reference}\n\n${(s.verse || '').replace(/<[^>]+>/g, '')}\n\n— Diario Bíblico`;
    if (navigator.share) {
      navigator.share({ title: s.title, text: shareText }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(shareText);
      showToast('Copiado al portapapeles ✓');
    }
  }

  /* ── Export / Import ── */
  function exportJSON() {
    const data = { version: 4, exportedAt: new Date().toISOString(), studies, plan, prayers, habit, settings };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `diario-biblico-${today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Backup descargado ✓');
  }

  function importJSON(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!confirm(`¿Importar ${data.studies?.length || 0} estudios? Se fusionarán con los actuales.`)) return;
        if (data.studies) {
          const existing = new Set(studies.map(s => s.id));
          data.studies.forEach(s => { if (!existing.has(s.id)) studies.push(s); });
          saveStudies();
        }
        if (data.prayers) { prayers = [...prayers, ...data.prayers]; savePrayers(); }
        if (data.habit) { habit = { ...habit, ...data.habit }; saveHabit(); }
        if (data.plan && !plan) { plan = data.plan; savePlan(); }
        renderSidebar();
        renderHeatmap();
        showToast('Importado ✓');
      } catch (err) {
        alert('Error al importar: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  /* ─────────────────────────────────────────────── MODALS ── */
  function openModal(kind) {
    const overlay = document.getElementById('modal');
    const content = document.getElementById('modal-content');
    if (kind === 'plan') content.innerHTML = renderPlanModal();
    else if (kind === 'prayer') content.innerHTML = renderPrayerModal();
    else if (kind === 'cal') content.innerHTML = renderCalModal();
    else if (kind === 'settings') content.innerHTML = renderSettingsModal();
    else if (kind === 'shortcuts') content.innerHTML = renderShortcutsModal();
    overlay.classList.add('open');
  }
  function closeModal() {
    document.getElementById('modal').classList.remove('open');
  }

  /* Plan modal */
  function renderPlanModal() {
    if (!plan) {
      return `
        <div class="modal-head">
          <h2>📖 Plan de lectura</h2>
          <button class="close-x" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <p style="color:var(--text2);margin-bottom:14px;">Elegí un plan para empezar. Vas a poder marcar cada día y crear estudios desde el plan.</p>
          <div class="plan-picker">
            ${Object.entries(PLANS).map(([k,v]) => `
              <div class="plan-option" onclick="startPlan('${k}')">
                <div class="plan-option-info">
                  <div class="plan-option-name">${v.name}</div>
                  <div class="plan-option-sub">${v.sub}</div>
                </div>
                <div class="plan-option-len">→</div>
              </div>
            `).join('')}
          </div>
        </div>`;
    }
    const days = PLANS[plan.id].gen();
    const completedCount = Object.keys(plan.completed || {}).length;
    const pct = Math.round((completedCount / days.length) * 100);
    const todayKey = today();
    // Find today's expected day (next undone)
    let todayDay = -1;
    for (let i = 0; i < days.length; i++) {
      if (!plan.completed?.[i]) { todayDay = i; break; }
    }
    return `
      <div class="modal-head">
        <h2>📖 ${plan.name}</h2>
        <button class="close-x" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="plan-summary">
          <div class="plan-summary-row">
            <div>
              <div class="plan-name">${esc(plan.name)}</div>
              <div class="plan-sub">${completedCount} / ${days.length} días completados</div>
            </div>
            <div class="plan-pct">${pct}%</div>
          </div>
          <div class="plan-bar"><div class="plan-bar-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="plan-list">
          ${days.map((d, i) => {
            const done = plan.completed?.[i];
            const isToday = i === todayDay;
            return `<div class="plan-day ${done ? 'done' : ''} ${isToday ? 'today' : ''}">
              <div class="plan-check" onclick="togglePlanDay(${i})">${done ? '✓' : ''}</div>
              <div class="plan-day-num">D${i+1}</div>
              <div class="plan-day-ref" onclick="planDayStudy(${i}, '${esc(d.ref).replace(/'/g, "\\'")}')">${esc(d.ref)}</div>
              <div class="plan-day-go">✦</div>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-sm btn-danger" onclick="abandonPlan()">Abandonar plan</button>
        <button class="btn-save" onclick="closeModal()">Cerrar</button>
      </div>`;
  }

  function startPlan(id) {
    plan = { id, name: PLANS[id].name, completed: {}, started: today() };
    savePlan();
    openModal('plan');
  }
  function abandonPlan() {
    if (!confirm('¿Abandonar el plan? Se perderá el progreso.')) return;
    plan = null;
    savePlan();
    openModal('plan');
  }
  function togglePlanDay(i) {
    if (!plan.completed) plan.completed = {};
    if (plan.completed[i]) delete plan.completed[i];
    else { plan.completed[i] = today(); recordHabit(); }
    savePlan();
    openModal('plan');
  }
  function planDayStudy(i, ref) {
    closeModal();
    const id = Date.now();
    studies.unshift({
      id, fav: false, template: 'soap', series: plan.name,
      title: 'Día ' + (i+1) + ' — ' + ref,
      reference: ref, book: ref.split(/\s\d/)[0], date: today(),
      tags: ['plan'], xrefs: [], verse: '', notes: '',
      soap: { s: '', o: '', a: '', p: '' }
    });
    saveStudies();
    if (!plan.completed) plan.completed = {};
    plan.completed[i] = today();
    savePlan();
    recordHabit();
    openStudy(id);
  }

  /* Prayer modal */
  function renderPrayerModal() {
    const active = prayers.filter(p => p.status === 'active');
    const answered = prayers.filter(p => p.status === 'answered');
    return `
      <div class="modal-head">
        <h2>🙏 Oraciones</h2>
        <button class="close-x" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="prayer-add">
          <input type="text" id="prayer-input" placeholder="Nueva petición de oración..." onkeydown="if(event.key==='Enter')addPrayer()" />
          <button class="btn-save" onclick="addPrayer()">+</button>
        </div>

        <div class="section-label" style="margin-top:14px;margin-bottom:8px;">Activas (${active.length})</div>
        ${active.length ? active.map(p => prayerHTML(p)).join('') : '<div style="color:var(--text3);font-style:italic;font-size:13px;padding:6px;">Sin peticiones activas.</div>'}

        ${answered.length ? `
          <div class="section-label" style="margin-top:18px;margin-bottom:8px;">Respondidas (${answered.length})</div>
          ${answered.map(p => prayerHTML(p)).join('')}
        ` : ''}
      </div>`;
  }

  function prayerHTML(p) {
    return `<div class="prayer-item ${p.status==='answered'?'answered':''}">
      <div class="prayer-row1">
        <button class="prayer-status-btn" onclick="togglePrayer(${p.id})" title="${p.status==='answered'?'Reactivar':'Marcar como respondida'}">${p.status==='answered'?'✓':''}</button>
        <textarea class="prayer-text" oninput="updatePrayerText(${p.id}, this.value)">${esc(p.text)}</textarea>
      </div>
      <div class="prayer-meta">
        <span>Agregada ${p.dateAdded}${p.dateAnswered?' · Respondida '+p.dateAnswered:''}</span>
        <span>
          <span class="prayer-cat" onclick="cyclePrayerCat(${p.id})">${esc(p.cat||'general')}</span>
          <span class="prayer-del" onclick="deletePrayer(${p.id})">✕</span>
        </span>
      </div>
    </div>`;
  }

  function addPrayer() {
    const input = document.getElementById('prayer-input');
    const val = input.value.trim();
    if (!val) return;
    prayers.unshift({ id: Date.now(), text: val, cat: 'personal', status: 'active', dateAdded: today() });
    savePrayers();
    openModal('prayer');
    setTimeout(() => document.getElementById('prayer-input')?.focus(), 50);
  }
  function togglePrayer(id) {
    const p = prayers.find(x => x.id === id);
    if (!p) return;
    if (p.status === 'answered') { p.status = 'active'; delete p.dateAnswered; }
    else { p.status = 'answered'; p.dateAnswered = today(); recordHabit(); }
    savePrayers();
    openModal('prayer');
  }
  function updatePrayerText(id, txt) {
    const p = prayers.find(x => x.id === id);
    if (!p) return;
    p.text = txt;
    savePrayers();
  }
  function cyclePrayerCat(id) {
    const cats = ['personal','familia','amigos','iglesia','trabajo','gratitud','intercesión','general'];
    const p = prayers.find(x => x.id === id);
    if (!p) return;
    const i = cats.indexOf(p.cat || 'personal');
    p.cat = cats[(i + 1) % cats.length];
    savePrayers();
    openModal('prayer');
  }
  function deletePrayer(id) {
    if (!confirm('¿Eliminar esta petición?')) return;
    prayers = prayers.filter(p => p.id !== id);
    savePrayers();
    openModal('prayer');
  }

  /* Calendar modal */
  function renderCalModal() {
    const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    const first = new Date(calYear, calMonth, 1);
    const startDow = (first.getDay() + 6) % 7; // Mon-first
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const todayKey = today();

    const studiesByDate = {};
    studies.forEach(s => { (studiesByDate[s.date] = studiesByDate[s.date] || []).push(s); });

    let cells = '';
    for (let i = 0; i < startDow; i++) cells += '<div class="cal-cell empty"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const k = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday = k === todayKey;
      const list = studiesByDate[k] || [];
      const items = list.slice(0, 2).map(s =>
        `<div class="cal-cell-item" title="${esc(s.title)}" onclick="event.stopPropagation();closeModal();openStudy(${s.id})">${esc(s.title)}</div>`
      ).join('');
      const more = list.length > 2 ? `<div class="cal-cell-item" style="color:var(--text3);">+${list.length-2}</div>` : '';
      cells += `<div class="cal-cell ${isToday?'today':''} ${list.length?'has-study':''}" onclick="closeModal();calNewOn('${k}')">
        <div class="cal-cell-num">${d}</div>
        <div class="cal-cell-list">${items}${more}</div>
      </div>`;
    }

    return `
      <div class="modal-head">
        <h2>🗓 ${monthNames[calMonth]} ${calYear}</h2>
        <div style="display:flex;gap:8px;align-items:center;">
          <div class="cal-nav">
            <button class="cal-nav-btn" onclick="calPrev()">‹</button>
            <button class="cal-nav-btn" onclick="calToday()">hoy</button>
            <button class="cal-nav-btn" onclick="calNext()">›</button>
          </div>
          <button class="close-x" onclick="closeModal()">×</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="calendar-wrap" style="padding:0;">
          <div class="cal-grid">
            ${['L','M','X','J','V','S','D'].map(d => `<div class="cal-dow">${d}</div>`).join('')}
            ${cells}
          </div>
        </div>
        <div style="margin-top:14px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);">
          Click en un día para crear un estudio · Click en un estudio para abrirlo
        </div>
      </div>`;
  }
  function calPrev() {
    calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
    openModal('cal');
  }
  function calNext() {
    calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
    openModal('cal');
  }
  function calToday() {
    calMonth = new Date().getMonth(); calYear = new Date().getFullYear();
    openModal('cal');
  }
  function calNewOn(date) {
    const id = Date.now();
    studies.unshift({
      id, fav: false, template: 'libre', series: '',
      title: 'Nuevo estudio', reference: '', book: '',
      date, tags: [], xrefs: [], verse: '', notes: '', soap: {}
    });
    saveStudies();
    openStudy(id);
    setTimeout(() => document.getElementById('ed-title')?.select(), 100);
  }

  /* Settings modal */
  function renderSettingsModal() {
    return `
      <div class="modal-head">
        <h2>⚙ Ajustes</h2>
        <button class="close-x" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">

        <div style="margin-bottom:18px;">
          <div class="section-label">Tamaño de texto</div>
          <input type="range" min="0.85" max="1.4" step="0.05" value="${settings.fontScale}"
            oninput="settings.fontScale=parseFloat(this.value);applyFontScale();this.nextElementSibling.textContent=Math.round(settings.fontScale*100)+'%'"
            onchange="saveSettings()" style="width:100%;" />
          <div style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);text-align:right;">${Math.round(settings.fontScale*100)}%</div>
        </div>

        <div style="margin-bottom:18px;">
          <div class="section-label">Tema</div>
          <div style="display:flex;gap:6px;">
            ${['light','dark','sepia'].map(t => `
              <button class="filter-btn ${settings.theme===t?'active':''}" style="flex:1;padding:8px;font-size:11px;"
                onclick="settings.theme='${t}';saveSettings();applyTheme();openModal('settings')">${t==='light'?'☀ Claro':t==='dark'?'🌙 Oscuro':'📜 Sepia'}</button>
            `).join('')}
          </div>
        </div>

        <div style="margin-bottom:18px;">
          <div class="section-label">Auto-guardado</div>
          <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);">
            <input type="checkbox" ${settings.autosave?'checked':''} onchange="settings.autosave=this.checked;saveSettings()" />
            Guardar automáticamente mientras escribo
          </label>
        </div>

        <div style="margin-bottom:18px;">
          <div class="section-label">Datos</div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <button class="btn-sm" onclick="exportJSON()" style="text-align:left;">↓ Exportar todo (JSON)</button>
            <button class="btn-sm" onclick="document.getElementById('import-file').click()" style="text-align:left;">↑ Importar JSON</button>
            <button class="btn-sm" onclick="exportAllPDF()" style="text-align:left;">⎙ Imprimir todo</button>
            <button class="btn-sm btn-danger" onclick="resetAll()" style="text-align:left;">⚠ Borrar todo</button>
          </div>
        </div>

        <div>
          <div class="section-label">Atajos</div>
          <button class="btn-sm" onclick="openModal('shortcuts')">Ver atajos de teclado</button>
        </div>
      </div>`;
  }

  function resetAll() {
    if (!confirm('¿Borrar TODOS los datos? Esto no se puede deshacer.')) return;
    if (!confirm('Última confirmación: ¿realmente borrar todo?')) return;
    [KEY, KEY_PLAN, KEY_PRAYER, KEY_HABIT, KEY_SETTINGS].forEach(k => localStorage.removeItem(k));
    location.reload();
  }

  function renderShortcutsModal() {
    const rows = [
      ['Nuevo estudio', ['Ctrl', 'N']],
      ['Buscar', ['Ctrl', 'K']],
      ['Guardar', ['Ctrl', 'S']],
      ['Modo lectura', ['Ctrl', '/']],
      ['Imprimir / PDF', ['Ctrl', 'P']],
      ['Plan de lectura', ['Ctrl', 'L']],
      ['Oraciones', ['Ctrl', 'O']],
      ['Calendario', ['Ctrl', 'M']],
      ['Cerrar modal', ['Esc']],
      ['Negrita (notas)', ['Ctrl', 'B']],
      ['Cursiva (notas)', ['Ctrl', 'I']],
      ['Esta ayuda', ['?']],
    ];
    return `
      <div class="modal-head">
        <h2>⌨ Atajos de teclado</h2>
        <button class="close-x" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="kbd-list">
          ${rows.map(([lbl, keys]) => `
            <div class="kbd-row">
              <span class="kbd-label">${lbl}</span>
              <span class="kbd-keys">${keys.map(k => `<span class="kbd">${k}</span>`).join('')}</span>
            </div>
          `).join('')}
        </div>
      </div>`;
  }

  /* ─────────────────────────────────────────────── SHORTCUTS ── */
  function bindShortcuts() {
    document.addEventListener('keydown', (e) => {
      // Esc
      if (e.key === 'Escape') {
        if (document.getElementById('modal').classList.contains('open')) {
          closeModal();
          e.preventDefault();
          return;
        }
      }
      // ? help
      if (e.key === '?' && !['INPUT','TEXTAREA'].includes(e.target.tagName) && !e.target.isContentEditable) {
        openModal('shortcuts'); e.preventDefault(); return;
      }
      const ctrl = e.ctrlKey || e.metaKey;
      if (!ctrl) return;
      const k = e.key.toLowerCase();
      if (k === 'n') { e.preventDefault(); newStudy(); }
      else if (k === 'k') { e.preventDefault(); document.getElementById('search-input')?.focus(); }
      else if (k === 's') { e.preventDefault(); saveCurrentStudy(true); }
      else if (k === '/') { e.preventDefault(); if (currentId) { readMode ? exitReadMode() : enterReadMode(); } }
      else if (k === 'p') { e.preventDefault(); if (currentId) printStudy(); }
      else if (k === 'l') { e.preventDefault(); openModal('plan'); }
      else if (k === 'o') { e.preventDefault(); openModal('prayer'); }
      else if (k === 'm') { e.preventDefault(); openModal('cal'); }
      else if (k === 'b' && document.activeElement?.id === 'ed-notes') { e.preventDefault(); mdWrap('**'); }
      else if (k === 'i' && document.activeElement?.id === 'ed-notes') { e.preventDefault(); mdWrap('*'); }
    });
  }

  // Periodic autosave fallback
  setInterval(() => {
    if (currentId && !readMode && settings.autosave) saveCurrentStudy(false, true);
  }, 30000);

</script>
