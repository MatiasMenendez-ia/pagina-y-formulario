<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diario Bíblico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #FFFFFF;
      --bg2:       #F5F4F0;
      --bg3:       #EEEDFE;
      --border:    rgba(0,0,0,0.12);
      --border2:   rgba(0,0,0,0.06);
      --text:      #1A1A2E;
      --text2:     #555466;
      --text3:     #999899;
      --purple:    #3C3489;
      --purple2:   #7F77DD;
      --purple3:   #EEEDFE;
      --purple4:   #AFA9EC;
      --purpleT:   #26215C;
      --danger:    #A32D2D;
      --star:      #C8962A;
      --verse-bg:  #EEEDFE;
      --verse-b:   #7F77DD;
      --verse-t:   #26215C;
      --meta-bg:   #F5F4F0;
      --input-bg:  #FFFFFF;
      --toast-bg:  #26215C;
    }

    body.dark {
      --bg:        #12101E;
      --bg2:       #1C1930;
      --bg3:       #251F3D;
      --border:    rgba(255,255,255,0.10);
      --border2:   rgba(255,255,255,0.05);
      --text:      #EAE9F8;
      --text2:     #AFA9EC;
      --text3:     #6B65A8;
      --purple:    #7F77DD;
      --purple2:   #AFA9EC;
      --purple3:   #251F3D;
      --purple4:   #3C3489;
      --purpleT:   #CECBF6;
      --danger:    #F09595;
      --star:      #E6B84A;
      --verse-bg:  #1E1A32;
      --verse-b:   #534AB7;
      --verse-t:   #CECBF6;
      --meta-bg:   #1C1930;
      --input-bg:  #12101E;
      --toast-bg:  #534AB7;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Crimson Pro', Georgia, serif;
      background: var(--bg2);
      color: var(--text);
      transition: background 0.25s, color 0.25s;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── TOPBAR ── */
    .topbar {
      background: var(--bg);
      border-bottom: 0.5px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
      transition: background 0.25s, border-color 0.25s;
    }

    .logo { display: flex; align-items: center; gap: 10px; }

    .logo-icon {
      width: 32px; height: 32px;
      background: var(--purple);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #EEEDFE;
      transition: background 0.25s;
      flex-shrink: 0;
    }

    .logo-text { font-size: 18px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; transition: color 0.25s; }
    .logo-sub { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; transition: color 0.25s; }

    .topbar-right { display: flex; gap: 8px; align-items: center; }

    .btn-dark {
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: 6px;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-dark:hover { background: var(--bg3); }

    .btn-primary {
      background: var(--purple);
      color: #EEEDFE;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-family: 'DM Mono', monospace;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .btn-primary:hover { opacity: 0.88; }

    /* ── LAYOUT ── */
    .main {
      display: flex;
      flex: 1;
      min-height: 0;
      height: calc(100vh - 57px);
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 240px;
      min-width: 240px;
      background: var(--bg);
      border-right: 0.5px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      transition: background 0.25s, border-color 0.25s, transform 0.25s;
    }

    .sidebar-inner { padding: 14px 12px; flex: 1; }
    .sidebar-section { margin-bottom: 22px; }

    .sidebar-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px; letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 8px; padding: 0 6px;
      transition: color 0.25s;
    }

    .search-box {
      width: 100%;
      padding: 7px 10px;
      border: 0.5px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      font-family: 'Crimson Pro', serif;
      background: var(--input-bg);
      color: var(--text);
      margin-bottom: 10px;
      transition: all 0.2s;
    }
    .search-box:focus { outline: none; border-color: var(--purple2); }
    .search-box::placeholder { color: var(--text3); }

    .study-list { display: flex; flex-direction: column; gap: 3px; }

    .study-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      border: 0.5px solid transparent;
      transition: background 0.12s, border-color 0.12s;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .study-item:hover { background: var(--bg2); }
    .study-item.active { background: var(--bg3); border-color: var(--purple4); }

    .si-body { flex: 1; min-width: 0; }
    .si-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .si-ref { font-size: 11px; color: var(--purple); font-family: 'DM Mono', monospace; margin-top: 2px; transition: color 0.25s; }
    .si-date { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; margin-top: 2px; }

    .fav-btn {
      background: none; border: none;
      font-size: 13px; cursor: pointer;
      padding: 1px 2px;
      line-height: 1;
      color: var(--text3);
      transition: transform 0.15s, color 0.15s;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .fav-btn:hover { transform: scale(1.2); }
    .fav-btn.active { color: var(--star); }

    .tag-grid { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 2px; }

    .tag {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      border: 0.5px solid var(--border);
      background: var(--bg2);
      color: var(--text2);
      transition: all 0.15s;
    }
    .tag:hover, .tag.active {
      background: var(--bg3);
      border-color: var(--purple4);
      color: var(--purpleT);
    }

    .filter-btns {
      display: flex; gap: 4px; margin-bottom: 8px;
    }
    .filter-btn {
      font-family: 'DM Mono', monospace;
      font-size: 9px; letter-spacing: 0.5px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      border: 0.5px solid var(--border);
      background: var(--bg2);
      color: var(--text3);
      transition: all 0.15s;
    }
    .filter-btn.active {
      background: var(--bg3); border-color: var(--purple4); color: var(--purpleT);
    }

    .stats-box {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text3);
      line-height: 2;
      padding: 0 6px;
      transition: color 0.25s;
    }

    .stat-row { display: flex; justify-content: space-between; }
    .stat-val { color: var(--purple2); }

    /* ── CONTENT ── */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow-y: auto;
      min-width: 0;
      transition: background 0.25s;
    }

    .empty-state {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      padding: 60px 40px;
    }
    .empty-icon {
      width: 50px; height: 50px;
      background: var(--bg3);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: var(--purple2);
    }
    .empty-text { font-size: 16px; font-style: italic; color: var(--text2); }
    .empty-sub { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); }

    /* ── EDITOR ── */
    .editor-header {
      padding: 16px 24px 12px;
      border-bottom: 0.5px solid var(--border);
      transition: border-color 0.25s;
      display: flex; align-items: center; gap: 10px;
    }

    .ed-title {
      font-family: 'Crimson Pro', serif;
      font-size: 22px; font-weight: 600;
      border: none; outline: none;
      background: transparent;
      color: var(--text);
      flex: 1;
      letter-spacing: -0.3px;
      transition: color 0.25s;
    }
    .ed-title::placeholder { color: var(--text3); }

    .ed-title[readonly] { cursor: default; }

    .read-badge {
      font-family: 'DM Mono', monospace;
      font-size: 9px; letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--verse-bg);
      color: var(--verse-b);
      border: 0.5px solid var(--purple4);
      white-space: nowrap;
    }

    .editor-meta {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 10px 24px;
      border-bottom: 0.5px solid var(--border);
      background: var(--meta-bg);
      transition: background 0.25s, border-color 0.25s;
    }

    .meta-input {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      padding: 5px 8px;
      border: 0.5px solid var(--border);
      border-radius: 4px;
      background: var(--input-bg);
      color: var(--text);
      transition: all 0.2s;
    }
    .meta-input:focus { outline: none; border-color: var(--purple2); }
    .meta-input[readonly] { background: transparent; border-color: transparent; cursor: default; }

    .editor-body {
      flex: 1;
      display: flex; flex-direction: column;
      padding: 20px 24px;
      gap: 16px;
    }

    .section-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px; letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 6px;
      transition: color 0.25s;
    }

    .verse-box {
      background: var(--verse-bg);
      border: 0.5px solid var(--purple4);
      border-left: 3px solid var(--verse-b);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 16px; font-style: italic;
      color: var(--verse-t);
      line-height: 1.7;
      min-height: 64px;
      font-family: 'Crimson Pro', serif;
      outline: none;
      transition: all 0.25s;
    }
    .verse-box[contenteditable="true"]:focus { border-color: var(--purple2); }
    .verse-box:empty::before {
      content: attr(data-placeholder);
      color: var(--purple4);
      font-style: italic;
    }

    /* Read mode verse */
    .verse-read {
      background: var(--verse-bg);
      border: 0.5px solid var(--purple4);
      border-left: 3px solid var(--verse-b);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 18px; font-style: italic;
      color: var(--verse-t);
      line-height: 1.8;
      font-family: 'Crimson Pro', serif;
    }

    .notes-row { flex: 1; display: flex; flex-direction: column; }

    .notes-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 5px;
    }

    .wc-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px; color: var(--text3);
      transition: color 0.25s;
    }

    /* Progress bar */
    .prog-wrap {
      height: 3px;
      background: var(--border2);
      border-radius: 3px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1), background 0.4s;
    }

    .notes-area {
      flex: 1;
      border: 0.5px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      font-family: 'Crimson Pro', serif;
      font-size: 16px; line-height: 1.8;
      color: var(--text);
      background: var(--input-bg);
      resize: none;
      min-height: 160px;
      transition: all 0.25s;
    }
    .notes-area:focus { outline: none; border-color: var(--purple2); }
    .notes-area::placeholder { color: var(--text3); font-style: italic; }
    .notes-area[readonly] { background: transparent; border-color: transparent; cursor: default; resize: none; }

    /* Read mode notes */
    .notes-read {
      flex: 1;
      padding: 4px 0;
      font-family: 'Crimson Pro', serif;
      font-size: 17px; line-height: 1.85;
      color: var(--text);
      white-space: pre-wrap;
    }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex; gap: 6px;
      padding: 10px 24px;
      border-top: 0.5px solid var(--border);
      background: var(--meta-bg);
      align-items: center; flex-wrap: wrap; justify-content: space-between;
      transition: background 0.25s, border-color 0.25s;
    }

    .tags-wrap { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }

    .tag-del { cursor: pointer; margin-left: 3px; opacity: 0.6; }
    .tag-del:hover { opacity: 1; }

    .toolbar-right { display: flex; gap: 8px; align-items: center; }

    .btn-sm {
      font-family: 'DM Mono', monospace;
      font-size: 11px; padding: 5px 10px;
      border: 0.5px solid var(--border);
      border-radius: 4px;
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      transition: all 0.12s;
    }
    .btn-sm:hover { background: var(--bg); color: var(--text); }
    .btn-danger { color: var(--danger) !important; }

    .btn-save {
      font-family: 'DM Mono', monospace;
      font-size: 12px; padding: 7px 18px;
      background: var(--purple);
      color: #EEEDFE;
      border: none; border-radius: 6px; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-save:hover { opacity: 0.88; }

    /* ── READ MODE TOOLBAR ── */
    .read-toolbar {
      display: flex; gap: 8px; align-items: center;
      padding: 10px 24px;
      border-top: 0.5px solid var(--border);
      background: var(--meta-bg);
      justify-content: flex-end;
      transition: background 0.25s, border-color 0.25s;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 22px; right: 22px;
      background: var(--toast-bg);
      color: #EEEDFE;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: 'DM Mono', monospace; font-size: 12px;
      opacity: 0; transform: translateY(10px);
      transition: all 0.25s; pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ── MOBILE TOGGLE ── */
    .menu-toggle {
      display: none;
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: 6px;
      width: 36px; height: 36px;
      align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px;
      transition: background 0.2s;
    }
    .menu-toggle:hover { background: var(--bg3); }

    .sidebar-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 19;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      .menu-toggle { display: flex; }

      .sidebar {
        position: fixed;
        top: 57px; left: 0; bottom: 0;
        z-index: 20;
        transform: translateX(-100%);
        width: 260px; min-width: 0;
        box-shadow: 4px 0 24px rgba(0,0,0,0.18);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.open { display: block; }

      .main { height: calc(100vh - 57px); }

      .editor-body { padding: 14px 14px; }
      .editor-meta { padding: 8px 14px; }
      .editor-header { padding: 12px 14px 10px; }
      .toolbar { padding: 8px 14px; }
      .read-toolbar { padding: 8px 14px; }

      .ed-title { font-size: 18px; }
      .notes-area { font-size: 15px; }
      .notes-read { font-size: 16px; }

      .toolbar-right { width: 100%; justify-content: flex-end; }
    }

    @media (max-width: 400px) {
      .btn-sm span { display: none; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px;">
    <button class="menu-toggle" onclick="toggleSidebar()" title="Menú">☰</button>
    <div class="logo">
      <div class="logo-icon">✦</div>
      <div>
        <div class="logo-text">Diario Bíblico</div>
        <div class="logo-sub">estudios &amp; anotaciones</div>
      </div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="btn-dark" id="dark-btn" onclick="toggleDark()" title="Modo oscuro">🌙</button>
    <button class="btn-primary" onclick="newStudy()">+ Nuevo</button>
  </div>
</div>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<div class="main">
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-inner">

      <div class="sidebar-section">
        <div class="filter-btns">
          <button class="filter-btn active" id="fb-all" onclick="setFavFilter('all')">Todos</button>
          <button class="filter-btn" id="fb-fav" onclick="setFavFilter('fav')">⭐ Favoritos</button>
        </div>
        <input class="search-box" type="text" placeholder="Buscar título, referencia, notas..." id="search-input" oninput="filterStudies(this.value)" />
        <div class="study-list" id="study-list"></div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Temas</div>
        <div class="tag-grid" id="tag-filters"></div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Estadísticas</div>
        <div class="stats-box" id="stats"></div>
      </div>

    </div>
  </div>

  <!-- CONTENT -->
  <div class="content" id="content">
    <div class="empty-state">
      <div class="empty-icon">✦</div>
      <div class="empty-text">Seleccioná un estudio o creá uno nuevo</div>
      <div class="empty-sub">tus anotaciones te esperan</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ── KEYS ── */
  const KEY      = 'diario_biblico_v3';
  const KEY_DARK = 'diario_dark_v3';

  let studies   = [];
  let currentId = null;
  let activeTag = null;
  let favFilter = 'all';   // 'all' | 'fav'
  let readMode  = false;
  let isDark    = false;

  /* ── INIT ── */
  (function init() {
    try { studies = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { studies = []; }
    try { isDark = JSON.parse(localStorage.getItem(KEY_DARK) || 'false'); } catch(e) {}

    // Migration: add missing fields
    studies = studies.map(s => ({
      fav: false,
      ...s,
      tags: s.tags || [],
    }));

    if (studies.length === 0) {
      studies = [
        {
          id: 1, fav: false,
          title: 'La fe como grano de mostaza',
          reference: 'Mateo 17:20', book: 'Mateo', date: '2025-04-28',
          tags: ['fe', 'parábolas'],
          verse: '"Si tuviereis fe como un grano de mostaza, diréis a este monte: Pásate de aquí allá, y se pasará."',
          notes: 'Reflexión: La fe no se mide en cantidad sino en calidad. Jesús no habla de tener mucha fe, sino de una fe genuina y confiada. La imagen del grano de mostaza me recuerda que algo pequeño pero real puede transformar montañas...\n\nAplicación personal: ¿En qué áreas de mi vida necesito ejercitar más esta fe activa?'
        },
        {
          id: 2, fav: true,
          title: 'El amor de Dios en Juan 3',
          reference: 'Juan 3:16', book: 'Juan', date: '2025-05-01',
          tags: ['amor', 'salvación'],
          verse: '"Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito..."',
          notes: 'Este versículo es el corazón del evangelio. La palabra "de tal manera" (houtos) en el griego indica la forma del amor, no solo el grado.\n\nDios no amó al mundo a pesar de su pecado, sino que respondió al problema del pecado con amor en acción.'
        }
      ];
      save();
    }

    applyDark();
    renderSidebar();
  })();

  /* ── DARK MODE ── */
  function applyDark() {
    document.body.classList.toggle('dark', isDark);
    document.getElementById('dark-btn').textContent = isDark ? '☀️' : '🌙';
    document.getElementById('dark-btn').title = isDark ? 'Modo claro' : 'Modo oscuro';
    localStorage.setItem(KEY_DARK, JSON.stringify(isDark));
  }
  function toggleDark() { isDark = !isDark; applyDark(); }

  /* ── MOBILE SIDEBAR ── */
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('open');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('open');
  }

  /* ── STORAGE ── */
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(studies)); } catch(e) {}
  }

  /* ── HELPERS ── */
  function esc(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function wordCount(text) {
    return (text || '').trim().split(/\s+/).filter(Boolean).length;
  }

  function allTags() {
    const set = new Set();
    studies.forEach(s => (s.tags || []).forEach(t => set.add(t)));
    return [...set];
  }

  /* Progress bar color based on % */
  function progColor(pct) {
    if (pct < 30) return '#AFA9EC';
    if (pct < 65) return '#7F77DD';
    return '#3C3489';
  }

  /* ── FAV FILTER ── */
  function setFavFilter(v) {
    favFilter = v;
    document.getElementById('fb-all').classList.toggle('active', v === 'all');
    document.getElementById('fb-fav').classList.toggle('active', v === 'fav');
    renderSidebar();
  }

  /* ── SIDEBAR ── */
  function renderSidebar(filter) {
    filter = filter !== undefined ? filter : document.getElementById('search-input').value || '';

    const q = filter.toLowerCase();

    const filtered = studies.filter(s => {
      const matchFav = favFilter === 'all' || s.fav;
      const matchText = !q ||
        s.title.toLowerCase().includes(q) ||
        (s.reference || '').toLowerCase().includes(q) ||
        (s.notes || '').toLowerCase().includes(q) ||
        (s.verse || '').toLowerCase().includes(q);
      const matchTag = !activeTag || (s.tags || []).includes(activeTag);
      return matchFav && matchText && matchTag;
    });

    document.getElementById('study-list').innerHTML = filtered.length
      ? filtered.map(s => `
          <div class="study-item ${s.id === currentId ? 'active' : ''}" onclick="openStudy(${s.id})">
            <div class="si-body">
              <div class="si-title">${esc(s.title)}</div>
              <div class="si-ref">${esc(s.reference)}</div>
              <div class="si-date">${s.date}</div>
            </div>
            <button class="fav-btn ${s.fav ? 'active' : ''}"
              onclick="event.stopPropagation();toggleFav(${s.id})"
              title="${s.fav ? 'Quitar de favoritos' : 'Marcar como favorito'}"
            >${s.fav ? '⭐' : '☆'}</button>
          </div>
        `).join('')
      : `<div style="padding:10px 6px;font-size:13px;color:var(--text3);font-style:italic;">Sin resultados</div>`;

    document.getElementById('tag-filters').innerHTML = allTags().map(t => `
      <span class="tag ${t === activeTag ? 'active' : ''}" onclick="filterTag('${esc(t)}')">${esc(t)}</span>
    `).join('');

    const totalWords = studies.reduce((a, s) => a + wordCount(s.notes), 0);
    const favCount   = studies.filter(s => s.fav).length;

    document.getElementById('stats').innerHTML = `
      <div class="stat-row"><span>Estudios</span><span class="stat-val">${studies.length}</span></div>
      <div class="stat-row"><span>Favoritos</span><span class="stat-val">${favCount}</span></div>
      <div class="stat-row"><span>Temas</span><span class="stat-val">${allTags().length}</span></div>
      <div class="stat-row"><span>Palabras</span><span class="stat-val">${totalWords.toLocaleString('es')}</span></div>
    `;
  }

  function filterStudies(val) { renderSidebar(val); }

  function filterTag(tag) {
    activeTag = activeTag === tag ? null : tag;
    renderSidebar();
  }

  /* ── FAV TOGGLE ── */
  function toggleFav(id) {
    const s = studies.find(x => x.id === id);
    if (!s) return;
    s.fav = !s.fav;
    save();
    renderSidebar();
    // update fav button in editor header if open
    const favHeaderBtn = document.getElementById('ed-fav');
    if (favHeaderBtn && currentId === id) {
      favHeaderBtn.textContent = s.fav ? '⭐' : '☆';
      favHeaderBtn.classList.toggle('active', s.fav);
      favHeaderBtn.title = s.fav ? 'Quitar de favoritos' : 'Marcar como favorito';
    }
    showToast(s.fav ? '⭐ Agregado a favoritos' : '☆ Quitado de favoritos');
  }

  /* ── EDITOR ── */
  function openStudy(id) {
    if (currentId !== null && !readMode) saveCurrentStudy();
    currentId = id;
    const s = studies.find(x => x.id === id);
    if (!s) return;
    renderSidebar();
    if (readMode) {
      renderReadMode(s);
    } else {
      renderEditor(s);
    }
    closeSidebar();
  }

  /* ── RENDER EDITOR ── */
  function renderEditor(s) {
    const wc  = wordCount(s.notes);
    const pct = Math.min(100, wc / 3);

    document.getElementById('content').innerHTML = `
      <div class="editor-header">
        <input class="ed-title" id="ed-title" value="${esc(s.title)}" placeholder="Título del estudio..." />
        <button class="fav-btn ${s.fav ? 'active' : ''}" id="ed-fav"
          onclick="toggleFav(${s.id})"
          title="${s.fav ? 'Quitar de favoritos' : 'Marcar como favorito'}"
          style="font-size:18px;"
        >${s.fav ? '⭐' : '☆'}</button>
      </div>
      <div class="editor-meta">
        <input class="meta-input" id="ed-ref" value="${esc(s.reference)}" placeholder="Referencia (ej: Juan 3:16)" style="flex:1;min-width:130px;" />
        <input class="meta-input" id="ed-book" value="${esc(s.book)}" placeholder="Libro" style="width:90px;" />
        <input class="meta-input" id="ed-date" type="date" value="${s.date}" />
      </div>
      <div class="editor-body">
        <div>
          <div class="section-label">Versículo o pasaje</div>
          <div class="verse-box" id="ed-verse" contenteditable="true"
               data-placeholder="Pegá o escribí el versículo aquí...">${esc(s.verse)}</div>
        </div>
        <div class="notes-row">
          <div class="notes-header">
            <div class="section-label" style="margin-bottom:0;">Notas &amp; reflexiones</div>
            <span class="wc-label" id="wc-label">${wc} ${wc === 1 ? 'palabra' : 'palabras'}</span>
          </div>
          <div class="prog-wrap">
            <div class="prog-fill" id="prog" style="width:${pct}%;background:${progColor(pct)}"></div>
          </div>
          <textarea class="notes-area" id="ed-notes"
            placeholder="Escribí tus anotaciones, reflexiones e interpretaciones...">${esc(s.notes)}</textarea>
        </div>
      </div>
      <div class="toolbar">
        <div class="tags-wrap" id="tags-wrap">
          ${(s.tags || []).map(t => `
            <span class="tag active">${esc(t)}<span class="tag-del" onclick="removeTag('${esc(t)}')">✕</span></span>
          `).join('')}
          <input id="tag-input" class="meta-input" placeholder="+ tema" style="width:90px;"
            onkeydown="addTagEnter(event)" />
        </div>
        <div class="toolbar-right">
          <button class="btn-sm" onclick="enterReadMode()" title="Modo lectura">👁 <span>Leer</span></button>
          <button class="btn-sm" onclick="duplicateStudy(${s.id})"><span>Duplicar</span></button>
          <button class="btn-sm btn-danger" onclick="deleteStudy(${s.id})"><span>Eliminar</span></button>
          <button class="btn-save" onclick="saveCurrentStudy(true)">Guardar</button>
        </div>
      </div>
    `;

    /* live word count */
    const notesEl = document.getElementById('ed-notes');
    notesEl.addEventListener('input', () => {
      const w = wordCount(notesEl.value);
      const p = Math.min(100, w / 3);
      document.getElementById('wc-label').textContent = w + (w === 1 ? ' palabra' : ' palabras');
      const fill = document.getElementById('prog');
      fill.style.width = p + '%';
      fill.style.background = progColor(p);
    });
  }

  /* ── READ MODE ── */
  function enterReadMode() {
    saveCurrentStudy();
    readMode = true;
    const s = studies.find(x => x.id === currentId);
    if (s) renderReadMode(s);
  }

  function renderReadMode(s) {
    document.getElementById('content').innerHTML = `
      <div class="editor-header">
        <div style="flex:1;">
          <div style="font-family:'Crimson Pro',serif;font-size:22px;font-weight:600;color:var(--text);letter-spacing:-0.3px;">${esc(s.title)}</div>
        </div>
        <span class="read-badge">MODO LECTURA</span>
        ${s.fav ? '<span style="font-size:18px;margin-left:4px;">⭐</span>' : ''}
      </div>
      <div class="editor-meta" style="pointer-events:none;opacity:0.75;">
        <span class="meta-input" style="border:none;background:transparent;">${esc(s.reference)}</span>
        <span class="meta-input" style="border:none;background:transparent;">${esc(s.book)}</span>
        <span class="meta-input" style="border:none;background:transparent;">${s.date}</span>
      </div>
      <div class="editor-body">
        ${s.verse ? `
          <div>
            <div class="section-label">Versículo o pasaje</div>
            <div class="verse-read">${esc(s.verse)}</div>
          </div>` : ''}
        <div class="notes-row">
          <div class="section-label">Notas &amp; reflexiones</div>
          <div class="notes-read">${esc(s.notes) || '<span style="color:var(--text3);font-style:italic;">Sin notas aún.</span>'}</div>
        </div>
        ${(s.tags||[]).length ? `
          <div style="display:flex;flex-wrap:wrap;gap:5px;padding-bottom:8px;">
            ${s.tags.map(t => `<span class="tag active" style="pointer-events:none;">${esc(t)}</span>`).join('')}
          </div>` : ''}
      </div>
      <div class="read-toolbar">
        <button class="btn-save" onclick="exitReadMode()">✏️ Editar</button>
      </div>
    `;
  }

  function exitReadMode() {
    readMode = false;
    const s = studies.find(x => x.id === currentId);
    if (s) renderEditor(s);
  }

  /* ── SAVE ── */
  function getCurrentData() {
    if (!currentId) return null;
    const s = studies.find(x => x.id === currentId);
    if (!s) return null;
    return {
      title:     document.getElementById('ed-title')?.value     ?? s.title,
      reference: document.getElementById('ed-ref')?.value       ?? s.reference,
      book:      document.getElementById('ed-book')?.value      ?? s.book,
      date:      document.getElementById('ed-date')?.value      ?? s.date,
      verse:     document.getElementById('ed-verse')?.innerText ?? s.verse,
      notes:     document.getElementById('ed-notes')?.value     ?? s.notes,
    };
  }

  function saveCurrentStudy(toast = false) {
    if (!currentId || readMode) return;
    const s = studies.find(x => x.id === currentId);
    if (!s) return;
    const data = getCurrentData();
    if (data) Object.assign(s, data);
    save();
    renderSidebar();
    if (toast) showToast('Guardado ✓');
  }

  /* ── CRUD ── */
  function newStudy() {
    if (currentId && !readMode) saveCurrentStudy();
    readMode = false;
    const id = Date.now();
    const today = new Date().toISOString().split('T')[0];
    studies.unshift({ id, fav: false, title: 'Nuevo estudio', reference: '', book: '', date: today, tags: [], verse: '', notes: '' });
    save();
    openStudy(id);
  }

  function duplicateStudy(id) {
    saveCurrentStudy();
    const s = studies.find(x => x.id === id);
    if (!s) return;
    const n = { ...s, id: Date.now(), fav: false, title: s.title + ' (copia)', date: new Date().toISOString().split('T')[0], tags: [...(s.tags||[])] };
    studies.unshift(n);
    save();
    openStudy(n.id);
    showToast('Estudio duplicado ✓');
  }

  function deleteStudy(id) {
    if (!confirm('¿Eliminar este estudio?')) return;
    studies = studies.filter(x => x.id !== id);
    currentId = null;
    readMode = false;
    save();
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">✦</div>
        <div class="empty-text">Seleccioná un estudio o creá uno nuevo</div>
        <div class="empty-sub">tus anotaciones te esperan</div>
      </div>`;
    renderSidebar();
  }

  /* ── TAGS ── */
  function addTagEnter(e) {
    if (e.key !== 'Enter') return;
    const input = document.getElementById('tag-input');
    const val = input.value.trim().toLowerCase();
    if (!val) return;
    const s = studies.find(x => x.id === currentId);
    if (!s) return;
    saveCurrentStudy();
    if (!s.tags.includes(val)) s.tags.push(val);
    input.value = '';
    save();
    renderSidebar();
    renderEditor(s);
  }

  function removeTag(tag) {
    const s = studies.find(x => x.id === currentId);
    if (!s) return;
    saveCurrentStudy();
    s.tags = s.tags.filter(t => t !== tag);
    save();
    renderSidebar();
    renderEditor(s);
  }

  /* ── TOAST ── */
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }
</script>
</body>
</html>
