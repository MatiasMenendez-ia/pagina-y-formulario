
<style>
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .app {
    font-family: 'Crimson Pro', Georgia, serif;
    min-height: 600px;
    background: var(--color-background-tertiary);
    display: flex;
    flex-direction: column;
  }

  .topbar {
    background: var(--color-background-primary);
    border-bottom: 0.5px solid var(--color-border-tertiary);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: #3C3489;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #EEEDFE;
  }

  .logo-text {
    font-size: 18px;
    font-weight: 600;
    color: var(--color-text-primary);
    letter-spacing: -0.3px;
  }

  .logo-sub {
    font-size: 12px;
    color: var(--color-text-secondary);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.5px;
  }

  .btn-primary {
    background: #3C3489;
    color: #EEEDFE;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-primary:hover { background: #26215C; }

  .main {
    display: grid;
    grid-template-columns: 240px 1fr;
    flex: 1;
    min-height: 540px;
  }

  .sidebar {
    background: var(--color-background-primary);
    border-right: 0.5px solid var(--color-border-tertiary);
    padding: 16px 12px;
    overflow-y: auto;
  }

  .sidebar-section {
    margin-bottom: 20px;
  }

  .sidebar-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
    margin-bottom: 8px;
    padding: 0 8px;
  }

  .tag-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 4px;
  }

  .tag {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
    border: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-secondary);
    color: var(--color-text-secondary);
    transition: all 0.15s;
  }

  .tag:hover, .tag.active {
    background: #EEEDFE;
    border-color: #AFA9EC;
    color: #3C3489;
  }

  .search-box {
    width: 100%;
    padding: 7px 10px;
    border: 0.5px solid var(--color-border-secondary);
    border-radius: 6px;
    font-size: 13px;
    font-family: 'Crimson Pro', serif;
    background: var(--color-background-secondary);
    color: var(--color-text-primary);
    margin-bottom: 12px;
  }

  .search-box:focus { outline: none; border-color: #7F77DD; }

  .study-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .study-item {
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.12s;
    border: 0.5px solid transparent;
  }

  .study-item:hover { background: var(--color-background-secondary); }
  .study-item.active {
    background: #EEEDFE;
    border-color: #AFA9EC;
  }

  .study-item-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--color-text-primary);
    line-height: 1.3;
  }

  .study-item-ref {
    font-size: 12px;
    color: #7F77DD;
    font-family: 'DM Mono', monospace;
    margin-top: 2px;
  }

  .study-item-date {
    font-size: 11px;
    color: var(--color-text-tertiary);
    font-family: 'DM Mono', monospace;
    margin-top: 3px;
  }

  .content {
    display: flex;
    flex-direction: column;
    background: var(--color-background-primary);
  }

  .editor-header {
    padding: 16px 24px 12px;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .editor-title-input {
    font-family: 'Crimson Pro', serif;
    font-size: 22px;
    font-weight: 600;
    border: none;
    outline: none;
    background: transparent;
    color: var(--color-text-primary);
    width: 100%;
    letter-spacing: -0.3px;
  }

  .editor-title-input::placeholder { color: var(--color-text-tertiary); }

  .editor-meta {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    padding: 10px 24px;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-secondary);
  }

  .meta-input {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 4px 8px;
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: 4px;
    background: var(--color-background-primary);
    color: var(--color-text-primary);
  }

  .meta-input:focus { outline: none; border-color: #7F77DD; }

  .editor-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 24px;
    gap: 16px;
  }

  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
    margin-bottom: 6px;
  }

  .verse-box {
    background: #EEEDFE;
    border: 0.5px solid #AFA9EC;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 16px;
    font-style: italic;
    color: #26215C;
    line-height: 1.7;
    min-height: 60px;
    border-left: 3px solid #7F77DD;
    font-family: 'Crimson Pro', serif;
    outline: none;
  }

  .verse-box:focus { border-color: #7F77DD; }
  .verse-box[contenteditable]:empty:before {
    content: attr(data-placeholder);
    color: #AFA9EC;
    font-style: italic;
  }

  .notes-area {
    flex: 1;
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: 8px;
    padding: 14px 16px;
    font-family: 'Crimson Pro', serif;
    font-size: 16px;
    line-height: 1.8;
    color: var(--color-text-primary);
    background: var(--color-background-primary);
    resize: none;
    min-height: 150px;
  }

  .notes-area:focus { outline: none; border-color: #7F77DD; }
  .notes-area::placeholder { color: var(--color-text-tertiary); font-style: italic; }

  .toolbar {
    display: flex;
    gap: 6px;
    padding: 8px 24px;
    border-top: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-secondary);
    align-items: center;
    flex-wrap: wrap;
    justify-content: space-between;
  }

  .toolbar-left { display: flex; gap: 6px; }

  .btn-tag-add {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    border: 0.5px solid var(--color-border-secondary);
    border-radius: 4px;
    background: transparent;
    color: var(--color-text-secondary);
    cursor: pointer;
    transition: all 0.12s;
  }

  .btn-tag-add:hover { background: var(--color-background-primary); color: var(--color-text-primary); }

  .btn-save {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 6px 18px;
    background: #3C3489;
    color: #EEEDFE;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-save:hover { background: #26215C; }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #26215C;
    color: #EEEDFE;
    padding: 10px 18px;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.25s;
    pointer-events: none;
  }

  .toast.show { opacity: 1; transform: translateY(0); }

  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: var(--color-text-tertiary);
    padding: 40px;
  }

  .empty-icon {
    width: 48px;
    height: 48px;
    background: #EEEDFE;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #7F77DD;
  }

  .empty-text { font-size: 15px; font-style: italic; }
  .empty-sub { font-family: 'DM Mono', monospace; font-size: 11px; }
</style>

<div class="app" id="app">
  <div class="topbar">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <div>
        <div class="logo-text">Diario Bíblico</div>
        <div class="logo-sub">estudios & anotaciones</div>
      </div>
    </div>
    <button class="btn-primary" onclick="newStudy()">+ Nuevo estudio</button>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-section">
        <input class="search-box" type="text" placeholder="Buscar..." id="search-input" oninput="filterStudies(this.value)">
        <div class="study-list" id="study-list"></div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Temas</div>
        <div class="tag-grid" id="tag-filters"></div>
      </div>
    </div>

    <div class="content" id="content-area">
      <div class="empty-state">
        <div class="empty-icon">✦</div>
        <div class="empty-text">Seleccioná un estudio o creá uno nuevo</div>
        <div class="empty-sub">tus anotaciones te esperan</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Guardado ✓</div>
</div>

<script>
const STORAGE_KEY = 'diario_biblico_v1';

let studies = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let currentId = null;
let activeTag = null;

if (studies.length === 0) {
  studies = [
    {
      id: 1,
      title: 'La fe como grano de mostaza',
      reference: 'Mateo 17:20',
      book: 'Mateo',
      date: '2025-04-28',
      tags: ['fe', 'parábolas'],
      verse: '"Si tuviereis fe como un grano de mostaza, diréis a este monte: Pásate de aquí allá, y se pasará."',
      notes: 'Reflexión: La fe no se mide en cantidad sino en calidad. Jesús no habla de tener mucha fe, sino de una fe genuina y confiada. La imagen del grano de mostaza me recuerda que algo pequeño pero real puede transformar montañas...\n\nAplicación personal: ¿En qué áreas de mi vida necesito ejercitar más esta fe activa?'
    },
    {
      id: 2,
      title: 'El amor de Dios en Juan 3',
      reference: 'Juan 3:16',
      book: 'Juan',
      date: '2025-05-01',
      tags: ['amor', 'salvación'],
      verse: '"Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito..."',
      notes: 'Este versículo es el corazón del evangelio. La palabra "de tal manera" (houtos) en el griego indica la forma del amor, no solo el grado.\n\nDios no amó al mundo a pesar de su pecado, sino que respondió al problema del pecado con amor en acción.'
    }
  ];
  saveAll();
}

function saveAll() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(studies));
}

function getAllTags() {
  const set = new Set();
  studies.forEach(s => (s.tags || []).forEach(t => set.add(t)));
  return [...set];
}

function renderSidebar(filter = '') {
  const list = document.getElementById('study-list');
  let filtered = studies.filter(s => {
    const matchText = !filter || s.title.toLowerCase().includes(filter.toLowerCase()) || s.reference.toLowerCase().includes(filter.toLowerCase());
    const matchTag = !activeTag || (s.tags || []).includes(activeTag);
    return matchText && matchTag;
  });

  list.innerHTML = filtered.map(s => `
    <div class="study-item ${s.id === currentId ? 'active' : ''}" onclick="openStudy(${s.id})">
      <div class="study-item-title">${s.title}</div>
      <div class="study-item-ref">${s.reference}</div>
      <div class="study-item-date">${s.date}</div>
    </div>
  `).join('');

  const tagEl = document.getElementById('tag-filters');
  const tags = getAllTags();
  tagEl.innerHTML = tags.map(t => `
    <span class="tag ${t === activeTag ? 'active' : ''}" onclick="filterByTag('${t}')">${t}</span>
  `).join('');
}

function filterStudies(val) {
  renderSidebar(val);
}

function filterByTag(tag) {
  activeTag = activeTag === tag ? null : tag;
  renderSidebar(document.getElementById('search-input').value);
}

function openStudy(id) {
  if (currentId !== null) saveCurrentStudy();
  currentId = id;
  const s = studies.find(x => x.id === id);
  if (!s) return;
  renderSidebar();

  document.getElementById('content-area').innerHTML = editorHTML(s);
}

function editorHTML(s) {
  return `
    <div class="editor-header">
      <input class="editor-title-input" id="ed-title" value="${escHtml(s.title)}" placeholder="Título del estudio..." />
    </div>
    <div class="editor-meta">
      <input class="meta-input" id="ed-reference" value="${escHtml(s.reference)}" placeholder="Referencia (ej: Juan 3:16)" />
      <input class="meta-input" id="ed-book" value="${escHtml(s.book)}" placeholder="Libro" style="width:100px" />
      <input class="meta-input" id="ed-date" type="date" value="${s.date}" />
    </div>
    <div class="editor-body">
      <div>
        <div class="section-label">Versículo o pasaje</div>
        <div class="verse-box" id="ed-verse" contenteditable="true" data-placeholder="Pegá o escribí el versículo aquí...">${escHtml(s.verse)}</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;">
        <div class="section-label">Notas & reflexiones</div>
        <textarea class="notes-area" id="ed-notes" placeholder="Escribí tus anotaciones, reflexiones e interpretaciones...">${escHtml(s.notes)}</textarea>
      </div>
    </div>
    <div class="toolbar">
      <div class="toolbar-left">
        <div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center;" id="ed-tags-display">
          ${(s.tags||[]).map(t => `<span class="tag active" onclick="removeTag('${t}')">${t} ✕</span>`).join('')}
          <input id="ed-tag-input" class="meta-input" placeholder="+ agregar tema" style="width:120px;" onkeydown="addTagOnEnter(event)" />
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn-tag-add" onclick="deleteStudy(${s.id})" style="color:var(--color-text-danger,#A32D2D);">Eliminar</button>
        <button class="btn-save" onclick="saveCurrentStudy(true)">Guardar</button>
      </div>
    </div>
  `;
}

function escHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getCurrentStudyData() {
  if (!currentId) return null;
  const s = studies.find(x => x.id === currentId);
  if (!s) return null;
  const title = document.getElementById('ed-title')?.value || s.title;
  const reference = document.getElementById('ed-reference')?.value || s.reference;
  const book = document.getElementById('ed-book')?.value || s.book;
  const date = document.getElementById('ed-date')?.value || s.date;
  const verse = document.getElementById('ed-verse')?.innerText || s.verse;
  const notes = document.getElementById('ed-notes')?.value || s.notes;
  return { title, reference, book, date, verse, notes };
}

function saveCurrentStudy(showToast = false) {
  if (!currentId) return;
  const s = studies.find(x => x.id === currentId);
  if (!s) return;
  const data = getCurrentStudyData();
  if (data) Object.assign(s, data);
  saveAll();
  renderSidebar(document.getElementById('search-input').value);
  if (showToast) showToastMsg('Guardado ✓');
}

function newStudy() {
  if (currentId) saveCurrentStudy();
  const id = Date.now();
  const today = new Date().toISOString().split('T')[0];
  studies.unshift({ id, title: 'Nuevo estudio', reference: '', book: '', date: today, tags: [], verse: '', notes: '' });
  saveAll();
  openStudy(id);
}

function deleteStudy(id) {
  if (!confirm('¿Eliminar este estudio?')) return;
  studies = studies.filter(x => x.id !== id);
  currentId = null;
  saveAll();
  document.getElementById('content-area').innerHTML = `<div class="empty-state"><div class="empty-icon">✦</div><div class="empty-text">Seleccioná un estudio o creá uno nuevo</div></div>`;
  renderSidebar();
}

function addTagOnEnter(e) {
  if (e.key !== 'Enter') return;
  const input = document.getElementById('ed-tag-input');
  const val = input.value.trim();
  if (!val) return;
  const s = studies.find(x => x.id === currentId);
  if (!s) return;
  if (!s.tags.includes(val)) s.tags.push(val);
  input.value = '';
  saveAll();
  openStudy(currentId);
}

function removeTag(tag) {
  const s = studies.find(x => x.id === currentId);
  if (!s) return;
  s.tags = s.tags.filter(t => t !== tag);
  saveAll();
  openStudy(currentId);
}

function showToastMsg(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

renderSidebar();
</script>
